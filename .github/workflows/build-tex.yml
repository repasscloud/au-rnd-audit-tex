name: Build TeX with Tectonic

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tectonic
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic
          tectonic --version

      - name: Compile static pack without warnings
        shell: bash
        run: ./static-pack/test-build.sh

      - name: Test and compile publishing pipeline without warnings
        shell: bash
        run: ./publishing-pipeline/publish.sh
